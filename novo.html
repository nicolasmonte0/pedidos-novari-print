<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="color-scheme" content="light dark">
<title>LicitaTrack — Novari Print</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@8.1.1/babel.min.js"></script>

<style>
:root{
  --bg:#F3F4F7; --surface:#FFFFFF; --col:#E9ECF2; --hover:#F3F5F9;
  --ink:#111B33; --ink-2:#4B5673; --muted:#6B7690;
  --line:#DFE3EA; --line-strong:#C8CFDB;
  --brand:#14213D; --brand-ink:#FFFFFF; --accent:#0F6E8C;
  --alert:#B42318; --alert-bg:#FEF1EF; --alert-solid:#B42318; --warn:#A54A08; --ok:#067647;
  --s1:#CBD2DE; --s2:#93A0BA; --s3:#566B94; --s4:#14213D;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0D1322; --surface:#151C2E; --col:#111828; --hover:#1C2540;
    --ink:#E8ECF5; --ink-2:#AAB3C8; --muted:#8B96AE;
    --line:#252E46; --line-strong:#34405C;
    --brand:#E8ECF5; --brand-ink:#0D1322; --accent:#5CC3E0;
    --alert:#FF8F80; --alert-bg:#3A1B18; --warn:#F2B25A; --ok:#5BD29A;
    --s1:#34405C; --s2:#55648A; --s3:#8497C4; --s4:#E8ECF5;
  }
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:14px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px}
.mono{width:36px;height:36px;border-radius:6px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:700;font-size:14px;letter-spacing:-.02em}
.brand-name{font-weight:700;font-size:15px;letter-spacing:-.01em;line-height:1.2}
.brand-sub{color:var(--muted);font-size:12.5px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sync{display:inline-flex;align-items:center;gap:6px;margin-right:6px;color:var(--muted);font-size:12.5px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.sync.busy i{background:var(--warn)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 12px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);color:var(--ink);font-weight:500;font-size:13px;cursor:pointer;transition:background .12s,border-color .12s}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.15)}
.btn.danger{color:var(--alert)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px}
.ib{display:inline-flex;gap:2px}
.ib button{width:28px;height:28px;display:grid;place-items:center;border:0;border-radius:6px;background:none;color:var(--muted);cursor:pointer}
.ib button:hover{background:var(--hover);color:var(--ink)}

.wrap{max-width:1320px;margin:0 auto;padding:16px 20px 40px}

.pano{margin:0 0 16px;padding:18px 20px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.pano-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px 44px}
.stat .n{display:block;font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .t{display:block;margin-top:2px;color:var(--muted);font-size:12.5px}
.late-pill,.ok-pill{margin-left:auto;display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;font-weight:600;font-size:13px}
.late-pill{background:var(--alert-bg);color:var(--alert)}
.ok-pill{background:var(--col);color:var(--ok)}
.bar{display:flex;gap:2px;height:12px;margin:18px 0 12px;border-radius:6px;overflow:hidden}
.bar i{display:block;min-width:6px}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 11px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink-2);font-weight:500;font-size:13px;cursor:pointer;transition:border-color .12s}
.chip:hover{border-color:var(--line-strong)}
.chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}
.chip b{color:var(--ink);font-variant-numeric:tabular-nums}
.sw{width:10px;height:10px;border-radius:3px}

.tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px}
.search{position:relative;flex:1;min-width:200px;max-width:420px}
.search input{width:100%;height:36px;padding:0 12px 0 35px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);color:var(--ink);font-size:14px}
.search .ic{position:absolute;left:11px;top:10px;color:var(--muted)}
.sel{height:36px;padding:0 10px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);color:var(--ink);font-size:13.5px;cursor:pointer}
.count{margin-left:auto;color:var(--muted);font-size:12.5px}

.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;align-items:start}
.col{background:var(--col);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.col-h{display:flex;align-items:center;gap:8px;padding:2px 4px 4px}
.col-h .ic{color:var(--ink-2)}
.col-h h2{margin:0;font-size:13.5px;font-weight:600}
.badge{padding:0 8px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink-2);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.sum{margin-left:auto;color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.empty{margin:6px 4px 10px;color:var(--muted);font-size:13px}
.card{padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:8px;cursor:pointer}
.card:hover{border-color:var(--line-strong)}
.card.is-late{box-shadow:inset 3px 0 0 var(--alert-solid)}
.c-top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:18px}
.num{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.urg{display:inline-flex;align-items:center;gap:6px;color:var(--alert);font-size:12px;font-weight:600;white-space:nowrap}
.urg::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.urg.alta{color:var(--warn)}
.card h3{margin:2px 0 0;font-size:14.5px;font-weight:600;letter-spacing:-.005em}
.desc{margin:1px 0 0;color:var(--ink-2);overflow-wrap:anywhere}
.meta{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;color:var(--ink-2);font-size:12.5px;font-variant-numeric:tabular-nums}
.meta span{display:inline-flex;align-items:center;gap:6px}
.meta .ic{width:14px;height:14px;color:var(--muted)}
.money{font-weight:600;color:var(--ink)}
.due{display:flex;align-items:center;gap:6px;margin-top:6px;color:var(--ink-2);font-size:12.5px;font-variant-numeric:tabular-nums}
.due .ic{width:14px;height:14px;color:var(--muted)}
.due em{font-style:normal;font-weight:600}
.due.late,.due.late .ic{color:var(--alert)}
.due.soon,.due.soon .ic{color:var(--warn)}
.obs{margin:8px 0 0;padding-top:8px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.c-act{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}

.ov{position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(9,14,28,.55)}
.dlg{width:520px;max-width:100%;max-height:92vh;overflow:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.dlg.sm{width:380px}
.dlg-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 22px 10px}
.dlg-h h2{margin:0;font-size:16px;font-weight:700;letter-spacing:-.01em}
.dlg-h .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.dlg-b{padding:6px 22px 18px}
.dlg-f{display:flex;gap:8px;justify-content:flex-end;padding:14px 22px;border-top:1px solid var(--line)}
.dlg-f .grow{flex:1}
.x{width:30px;height:30px;display:grid;place-items:center;border:0;border-radius:6px;background:none;color:var(--muted);cursor:pointer;flex:none}
.x:hover{background:var(--hover);color:var(--ink)}
.form{display:grid;gap:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f label{display:block;margin-bottom:5px;font-weight:600;font-size:12.5px;color:var(--ink-2)}
.inp{width:100%;padding:9px 11px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);color:var(--ink);font-size:14px}
textarea.inp{resize:vertical;min-height:60px}
.tabs2{display:flex;gap:4px;padding:0 22px;border-bottom:1px solid var(--line)}
.tab2{border:0;background:none;padding:9px 10px;font-weight:500;font-size:13.5px;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer}
.tab2[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand)}
.kv{display:flex;gap:14px;padding:9px 0;border-bottom:1px solid var(--line)}
.kv dt{width:104px;flex:none;color:var(--muted);font-size:12.5px}
.kv dd{margin:0;overflow-wrap:anywhere}
.kv dd.bad{color:var(--alert);font-weight:600}
.tl{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.tl i{width:8px;height:8px;margin-top:6px;border-radius:50%;background:var(--s3);flex:none}
.tl .tt{display:flex;justify-content:space-between;gap:10px}
.tl b{font-weight:600}
.tl small{color:var(--muted);font-size:12px}
.tl p{margin:2px 0 0;color:var(--ink-2)}
.fin{display:grid;grid-template-columns:repeat(3,1fr);margin:6px 0 4px;border:1px solid var(--line);border-radius:8px}
.fin div{padding:12px 14px;border-left:1px solid var(--line)}
.fin div:first-child{border-left:0}
.fin .n{display:block;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.fin .t{color:var(--muted);font-size:12px}
.ss h4{display:flex;align-items:center;gap:8px;margin:18px 0 2px;font-size:13px;font-weight:600}
.ss.bad h4{color:var(--alert)}
.ss.soon h4{color:var(--warn)}
.ss-r{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.ss-r small{display:block;color:var(--muted);font-size:12.5px}
.ss-r .tag{white-space:nowrap;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.ss.bad .tag{color:var(--alert)}
.ss.soon .tag{color:var(--warn)}
.ss-ok{margin:14px 0 0;padding:10px 12px;border-radius:8px;background:var(--col);color:var(--ok);font-weight:600}
.toast{position:fixed;right:22px;bottom:22px;z-index:900;display:flex;align-items:center;gap:8px;max-width:340px;padding:11px 16px;border-radius:8px;background:var(--brand);color:var(--brand-ink);font-weight:500;font-size:13.5px;box-shadow:0 8px 28px rgba(0,0,0,.25)}
.toast.err{background:var(--alert-solid);color:#fff}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:24px;text-align:center}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media (max-width:820px){
  .btn .t-btn{display:none}
  .btn{padding:0 10px}
  .row2{grid-template-columns:1fr}
  .fin{grid-template-columns:1fr}
  .fin div{border-left:0;border-top:1px solid var(--line)}
  .fin div:first-child{border-top:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:.01ms!important}}
</style>
</head>

<script type="text/babel">
const { useState, useEffect, useRef } = React;
const db = window._db;
const IS_CFG = window.IS_CFG;
const COL = "pedidos";

/* ---------- Configuração ---------- */
const STAGES = [
  { id:"pendente",  label:"Pendente",     icon:"clock",   act:"Iniciar confecção",    next:"confeccao", prev:null,        sw:"var(--s1)" },
  { id:"confeccao", label:"Em confecção", icon:"printer", act:"Enviar para entrega",  next:"entrega",   prev:"pendente",  sw:"var(--s2)" },
  { id:"entrega",   label:"Em entrega",   icon:"truck",   act:"Marcar como entregue", next:"entregue",  prev:"confeccao", sw:"var(--s3)" },
  { id:"entregue",  label:"Entregue",     icon:"check",   act:null,                   next:null,        prev:"entrega",   sw:"var(--s4)" },
];
const PRIORITIES = [
  { id:"urgente", label:"Urgente" },
  { id:"alta",    label:"Alta" },
  { id:"media",   label:"Média" },
  { id:"baixa",   label:"Baixa" },
];

const ICONS = {
  plus:<><path d="M5 12h14"/><path d="M12 5v14"/></>,
  search:<><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></>,
  calendar:<><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></>,
  clock:<><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></>,
  printer:<><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 9V3a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v6"/><rect x="6" y="14" width="12" height="8" rx="1"/></>,
  truck:<><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/></>,
  check:<><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></>,
  alert:<><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></>,
  file:<><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></>,
  sheet:<><path d="M12 3v18"/><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/></>,
  save:<><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/><path d="M7 3v4a1 1 0 0 0 1 1h7"/></>,
  upload:<><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></>,
  pencil:<><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></>,
  trash:<><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></>,
  package:<><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></>,
  back:<><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></>,
  user:<><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></>,
  x:<><path d="M18 6 6 18"/><path d="m6 6 12 12"/></>,
};
function Ic({ n }) {
  return <svg className="ic" viewBox="0 0 24 24" aria-hidden="true">{ICONS[n]}</svg>;
}

/* ---------- Utilidades ---------- */
function uid() { return "PED-" + Date.now().toString().slice(-7); }
function todayStr() { return new Date().toISOString().slice(0, 10); }
function formatDate(s) { return s ? new Date(s + "T12:00:00").toLocaleDateString("pt-BR") : "—"; }
function formatDT(s) {
  if (!s) return "—";
  const d = new Date(s);
  return d.toLocaleDateString("pt-BR") + " " + d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
}
function formatBRL(v) {
  if (v === "" || v == null || isNaN(Number(v))) return "—";
  return Number(v).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
}
function dayDiff(p) {
  if (!p) return null;
  const [y, m, d] = p.split("-").map(Number);
  const t = new Date();
  return Math.round((Date.UTC(y, m - 1, d) - Date.UTC(t.getFullYear(), t.getMonth(), t.getDate())) / 864e5);
}
function isOverdue(o) { const d = dayDiff(o.prazo); return d !== null && d < 0 && o.status !== "entregue"; }
function dueInfo(o) {
  const d = dayDiff(o.prazo);
  if (d === null) return null;
  const t = formatDate(o.prazo);
  if (o.status === "entregue") return { k: "ok", t, r: "" };
  if (d < 0) return { k: "late", t, r: (-d) + (d === -1 ? " dia" : " dias") + " de atraso" };
  if (d === 0) return { k: "soon", t, r: "vence hoje" };
  if (d === 1) return { k: "soon", t, r: "vence amanhã" };
  if (d <= 3) return { k: "soon", t, r: "em " + d + " dias" };
  return { k: "ok", t, r: "" };
}
function tidy(s) {
  const t = String(s == null ? "" : s);
  return t && t === t.toUpperCase() && t !== t.toLowerCase() ? t.charAt(0) + t.slice(1).toLowerCase() : t;
}
function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function sumVal(list) { return list.reduce((s, o) => s + (Number(o.valor) || 0), 0); }
function byPrazo(a, b) {
  if (!a.prazo && !b.prazo) return 0;
  if (!a.prazo) return 1;
  if (!b.prazo) return -1;
  return a.prazo < b.prazo ? -1 : a.prazo > b.prazo ? 1 : 0;
}
function pushHistory(order, acao, detalhes) {
  return { ...order, historico: [...(order.historico || []), { data: new Date().toISOString(), acao, detalhes }] };
}
function stageLabel(id) { const s = STAGES.find(x => x.id === id); return s ? s.label : id; }
function download(blob, name) {
  const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(blob), download: name });
  document.body.appendChild(a); a.click(); a.remove();
}

/* ---------- Aplicativo ---------- */
function App() {
  const [orders, setOrders] = useState([]);
  const [loading, setLoading] = useState(true);
  const [connErr, setConnErr] = useState(null);
  const [modal, setModal] = useState(null);
  const [form, setForm] = useState({});
  const [detailId, setDetailId] = useState(null);
  const [search, setSearch] = useState("");
  const [fStage, setFStage] = useState("todos");
  const [fPrio, setFPrio] = useState("all");
  const [toast, setToast] = useState(null);
  const [confirmDel, setConfirmDel] = useState(null);
  const [showSum, setShowSum] = useState(false);
  const [saving, setSaving] = useState(false);
  const fileRef = useRef(null);

  useEffect(() => {
    if (!IS_CFG) { setLoading(false); setConnErr("Não foi possível iniciar o Firebase."); return; }
    const unsub = db.collection(COL).orderBy("criadoEm", "asc").onSnapshot(
      snap => { setOrders(snap.docs.map(d => d.data())); setLoading(false); setConnErr(null); },
      err => { setConnErr(err.message); setLoading(false); }
    );
    return unsub;
  }, []);

  useEffect(() => {
    if (loading || connErr) return;
    try {
      if (localStorage.getItem("lt-summary") !== todayStr()) {
        setShowSum(true);
        localStorage.setItem("lt-summary", todayStr());
      }
    } catch (e) {}
  }, [loading]);

  function flash(msg, type) {
    setToast({ msg, type: type || "ok" });
    setTimeout(() => setToast(null), 3000);
  }
  async function fbSet(order) {
    setSaving(true);
    try { await db.collection(COL).doc(order.id).set(order); }
    catch (e) { flash("Erro ao salvar: " + e.message, "err"); }
    finally { setSaving(false); }
  }
  async function fbDel(id) {
    try { await db.collection(COL).doc(id).delete(); }
    catch (e) { flash("Erro ao excluir: " + e.message, "err"); }
  }

  function openAdd() {
    setForm({ numero: "", cliente: "", descricao: "", quantidade: "", valor: "", prazo: "", status: "pendente", prioridade: "media", responsavel: "", observacoes: "" });
    setModal("add");
  }
  function openEdit(o) { setForm({ ...o }); setModal("edit"); }
  function openDetail(o) { setDetailId(o.id); setModal("detail"); }

  async function handleSave() {
    if (!form.cliente || !form.cliente.trim() || !form.descricao || !form.descricao.trim()) {
      flash("Preencha o cliente e a descrição.", "err"); return;
    }
    let updated;
    if (modal === "add") {
      updated = pushHistory({ ...form, id: uid(), criadoEm: new Date().toISOString(), historico: [] }, "Criado", "Pedido adicionado ao sistema");
      flash("Pedido criado.");
    } else {
      const old = orders.find(o => o.id === form.id) || {};
      const ch = [];
      if (old.status !== form.status) ch.push("Etapa: " + stageLabel(old.status) + " → " + stageLabel(form.status));
      if (old.prazo !== form.prazo) ch.push("Prazo alterado");
      if (old.valor !== form.valor) ch.push("Valor alterado");
      if (old.quantidade !== form.quantidade) ch.push("Quantidade alterada");
      if (old.prioridade !== form.prioridade) ch.push("Prioridade alterada");
      if (old.responsavel !== form.responsavel) ch.push("Responsável alterado");
      if (old.observacoes !== form.observacoes) ch.push("Observações alteradas");
      updated = pushHistory({ ...form }, "Editado", ch.length ? ch.join(" · ") : "Campos atualizados");
      flash("Pedido atualizado.");
    }
    setModal(null);
    await fbSet(updated);
  }
  async function handleDelete(id) {
    setModal(null); setConfirmDel(null);
    await fbDel(id);
    flash("Pedido excluído.");
  }
  async function moveTo(o, to) {
    await fbSet(pushHistory({ ...o, status: to }, "Etapa alterada", stageLabel(o.status) + " → " + stageLabel(to)));
    flash("Pedido movido para " + stageLabel(to).toLowerCase() + ".");
  }

  function exportCSV() {
    const h = ["ID", "Nº Processo", "Cliente", "Descrição", "Qtd", "Valor (R$)", "Prazo", "Etapa", "Prioridade", "Responsável", "Observações", "Criado em"];
    const rows = orders.map(o => [
      o.id, o.numero || "", o.cliente, o.descricao, o.quantidade || "", o.valor || "",
      o.prazo ? formatDate(o.prazo) : "", stageLabel(o.status),
      (PRIORITIES.find(p => p.id === o.prioridade) || {}).label || o.prioridade || "",
      o.responsavel || "", o.observacoes || "", o.criadoEm ? new Date(o.criadoEm).toLocaleDateString("pt-BR") : ""
    ].map(v => '"' + String(v).replace(/"/g, '""') + '"').join(","));
    download(new Blob(["\uFEFF" + [h.join(","), ...rows].join("\n")], { type: "text/csv;charset=utf-8;" }), "pedidos-" + todayStr() + ".csv");
    flash("Planilha exportada.");
  }

  function exportPDF() {
    const lateN = orders.filter(isOverdue).length;
    const now = new Date();
    const sections = STAGES.map(s => {
      const items = orders.filter(o => o.status === s.id).sort(byPrazo);
      if (!items.length) return "";
      const v = sumVal(items);
      const rows = items.map(o => {
        const late = isOverdue(o);
        return "<tr><td>" + esc(o.numero || o.id) + "</td><td><b>" + esc(o.cliente) + "</b></td><td>" + esc(tidy(o.descricao)) +
          "</td><td class='r'>" + esc(o.quantidade ? Number(o.quantidade).toLocaleString("pt-BR") : "—") +
          "</td><td class='r'>" + esc(o.valor ? formatBRL(o.valor) : "—") +
          "</td><td class='" + (late ? "late" : "") + "'>" + esc(formatDate(o.prazo)) +
          "</td><td>" + esc(o.observacoes ? tidy(o.observacoes) : "—") + "</td></tr>";
      }).join("");
      return "<div class='sec-h'><h4>" + s.label + "</h4><span>" + items.length + (items.length === 1 ? " pedido" : " pedidos") + "</span>" +
        (v > 0 ? "<span>" + formatBRL(v) + "</span>" : "") + "</div>" +
        "<table><thead><tr><th>Nº</th><th>Cliente</th><th>Descrição</th><th class='r'>Qtd</th><th class='r'>Valor</th><th>Prazo</th><th>Observações</th></tr></thead><tbody>" + rows + "</tbody></table>";
    }).join("");
    const html = "<!DOCTYPE html><html lang='pt-BR'><head><meta charset='UTF-8'><title>Relatório de pedidos — Novari Print</title>" +
      "<link href='https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap' rel='stylesheet'>" +
      "<style>@page{margin:14mm}*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}" +
      "body{margin:0;padding:24px;font:11.5px/1.45 Inter,Arial,sans-serif;color:#111B33}" +
      ".lh{display:flex;justify-content:space-between;gap:24px;padding-bottom:14px;border-bottom:2px solid #14213D}" +
      ".lh-l{display:flex;gap:14px;align-items:center}" +
      ".mono{width:44px;height:44px;border-radius:6px;background:#14213D;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px}" +
      ".nm{font-weight:700;font-size:16px;line-height:1.2}.sb{color:#5B6680;font-size:11px;line-height:1.5}" +
      ".lh-r{text-align:right}.tt{font-weight:700;font-size:16px}.dt{color:#5B6680;font-size:11.5px}" +
      ".sr{display:flex;margin:18px 0 4px}.sr div{padding:0 24px;border-left:1px solid #DDE2EA}.sr div:first-child{padding-left:0;border-left:0}" +
      ".sr .n{display:block;font-size:19px;font-weight:700}.sr .t{color:#5B6680;font-size:11px}.sr .bad .n{color:#B42318}" +
      ".sec-h{display:flex;align-items:baseline;gap:10px;margin:22px 0 5px;break-after:avoid}.sec-h h4{margin:0;font-size:13px}.sec-h span{color:#5B6680;font-size:11.5px}" +
      "table{width:100%;border-collapse:collapse}thead{display:table-header-group}tr{break-inside:avoid}" +
      "th{padding:6px 7px;text-align:left;font-weight:600;color:#5B6680;border-bottom:1px solid #111B33;white-space:nowrap}" +
      "td{padding:7px;border-bottom:1px solid #DDE2EA;vertical-align:top}.r{text-align:right}.late{color:#B42318;font-weight:600}" +
      ".pf{display:flex;justify-content:space-between;margin-top:26px;padding-top:8px;border-top:1px solid #DDE2EA;color:#5B6680;font-size:10.5px}" +
      "</style></head><body>" +
      "<div class='lh'><div class='lh-l'><div class='mono'>NP</div><div><div class='nm'>Novari Print</div>" +
      "<div class='sb'>Novari Print Comércio de Papelaria e Serviços Gráficos Ltda.<br>CNPJ 16.943.709/0001-60</div></div></div>" +
      "<div class='lh-r'><div class='tt'>Relatório de pedidos</div><div class='dt'>Emitido em " + now.toLocaleDateString("pt-BR") + " às " + now.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }) + "</div></div></div>" +
      "<div class='sr'><div><span class='n'>" + orders.length + "</span><span class='t'>pedidos</span></div>" +
      "<div><span class='n'>" + formatBRL(sumVal(orders)) + "</span><span class='t'>em carteira</span></div>" +
      "<div class='" + (lateN ? "bad" : "") + "'><span class='n'>" + lateN + "</span><span class='t'>atrasados</span></div>" +
      "<div><span class='n'>" + orders.filter(o => o.status === "entregue").length + "</span><span class='t'>entregues</span></div></div>" +
      sections +
      "<div class='pf'><span>Novari Print</span><span>Gerado pelo LicitaTrack</span></div>" +
      "<script>window.addEventListener('load',function(){setTimeout(function(){window.print()},300)})<\/script></body></html>";
    const win = window.open("", "_blank");
    if (!win) { flash("Permita pop-ups neste site para gerar o PDF.", "err"); return; }
    win.document.write(html);
    win.document.close();
  }

  function downloadBackup() {
    download(new Blob([JSON.stringify({ versao: "firebase-v1", exportadoEm: new Date().toISOString(), pedidos: orders }, null, 2)], { type: "application/json" }), "backup-" + todayStr() + ".json");
    flash("Backup salvo.");
  }
  async function handleRestore(e) {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      const list = Array.isArray(data) ? data : data.pedidos;
      if (!Array.isArray(list)) throw new Error("formato");
      for (let i = 0; i < list.length; i += 400) {
        const batch = db.batch();
        list.slice(i, i + 400).forEach(o => batch.set(db.collection(COL).doc(o.id), o));
        await batch.commit();
      }
      flash(list.length + " pedidos restaurados.");
    } catch (err) { flash("Arquivo de backup inválido.", "err"); }
    e.target.value = "";
  }

  /* ----- Derivados ----- */
  const q = search.trim().toLowerCase();
  const visible = orders.filter(o =>
    (fPrio === "all" || o.prioridade === fPrio) &&
    (!q || [o.cliente, o.descricao, o.numero, o.id, o.responsavel, o.observacoes].some(f => f && String(f).toLowerCase().includes(q)))
  );
  const stageList = id => {
    const l = visible.filter(o => o.status === id).sort(byPrazo);
    return id === "entregue" ? l.reverse() : l;
  };
  const counts = {};
  STAGES.forEach(s => { counts[s.id] = orders.filter(o => o.status === s.id).length; });
  const lateCount = orders.filter(isOverdue).length;
  const shown = STAGES.filter(s => fStage === "todos" || fStage === s.id).reduce((n, s) => n + stageList(s.id).length, 0);
  const detailOrder = detailId ? orders.find(o => o.id === detailId) : null;

  if (loading) return <div className="center"><div className="spin"></div><p style={{ color: "var(--muted)" }}>Conectando ao Firebase…</p></div>;
  if (connErr) return (
    <div className="center">
      <h2 style={{ margin: 0 }}>Não foi possível carregar os pedidos</h2>
      <p style={{ color: "var(--ink-2)", maxWidth: 420, margin: 0 }}>{connErr}</p>
      <p style={{ color: "var(--muted)", fontSize: 13, margin: 0 }}>Confira a conexão com a internet e as regras do Firestore.</p>
      <button className="btn primary" onClick={() => location.reload()}>Tentar novamente</button>
    </div>
  );

  return (
    <>
      <header className="top">
        <div className="brand">
          <div className="mono" aria-hidden="true">NP</div>
          <div>
            <div className="brand-name">Novari Print</div>
            <div className="brand-sub">Pedidos de licitação</div>
          </div>
        </div>
        <div className="actions">
          <span className={"sync" + (saving ? " busy" : "")}><i></i>{saving ? "Salvando…" : "Sincronizado"}</span>
          <button className="btn" onClick={() => setShowSum(true)} title="Resumo do dia"><Ic n="calendar" /><span className="t-btn">Resumo</span></button>
          <button className="btn" onClick={exportCSV} title="Exportar planilha (CSV)"><Ic n="sheet" /><span className="t-btn">Planilha</span></button>
          <button className="btn" onClick={exportPDF} title="Gerar relatório em PDF"><Ic n="file" /><span className="t-btn">Relatório PDF</span></button>
          <button className="btn" onClick={downloadBackup} title="Salvar backup"><Ic n="save" /><span className="t-btn">Backup</span></button>
          <button className="btn" onClick={() => fileRef.current && fileRef.current.click()} title="Restaurar backup"><Ic n="upload" /><span className="t-btn">Restaurar</span></button>
          <input ref={fileRef} type="file" accept=".json" onChange={handleRestore} style={{ display: "none" }} />
          <button className="btn primary" onClick={openAdd}><Ic n="plus" />Novo pedido</button>
        </div>
      </header>

      <main className="wrap">
        <section className="pano" aria-label="Panorama dos pedidos">
          <div className="pano-head">
            <div className="stat"><span className="n">{orders.length}</span><span className="t">pedidos</span></div>
            <div className="stat"><span className="n">{formatBRL(sumVal(orders))}</span><span className="t">em carteira</span></div>
            {lateCount > 0
              ? <div className="late-pill"><Ic n="alert" />{lateCount} {lateCount === 1 ? "pedido atrasado" : "pedidos atrasados"}</div>
              : <div className="ok-pill"><Ic n="check" />Nenhum pedido atrasado</div>}
          </div>
          {orders.length > 0 && (
            <div className="bar" role="img" aria-label={STAGES.map(s => counts[s.id] + " " + s.label.toLowerCase()).join(", ")}>
              {STAGES.filter(s => counts[s.id] > 0).map(s => <i key={s.id} style={{ flex: counts[s.id], background: s.sw }}></i>)}
            </div>
          )}
          <div className="legend">
            <button className="chip" aria-pressed={fStage === "todos"} onClick={() => setFStage("todos")}>Todos <b>{orders.length}</b></button>
            {STAGES.map(s => (
              <button key={s.id} className="chip" aria-pressed={fStage === s.id} onClick={() => setFStage(fStage === s.id ? "todos" : s.id)}>
                <span className="sw" style={{ background: s.sw }}></span>{s.label} <b>{counts[s.id]}</b>
              </button>
            ))}
          </div>
        </section>

        <div className="tools">
          <div className="search">
            <Ic n="search" />
            <input type="search" value={search} onChange={e => setSearch(e.target.value)} placeholder="Buscar por cliente, número, descrição ou responsável" aria-label="Buscar pedidos" />
          </div>
          <select className="sel" value={fPrio} onChange={e => setFPrio(e.target.value)} aria-label="Filtrar por prioridade">
            <option value="all">Todas as prioridades</option>
            {PRIORITIES.map(p => <option key={p.id} value={p.id}>{p.label}</option>)}
          </select>
          {(search || fPrio !== "all") && <button className="btn" onClick={() => { setSearch(""); setFPrio("all"); }}>Limpar filtros</button>}
          <span className="count">Mostrando {shown} de {orders.length} pedidos</span>
        </div>

        <div className="board">
          {STAGES.filter(s => fStage === "todos" || fStage === s.id).map(s => {
            const list = stageList(s.id);
            const v = sumVal(list);
            return (
              <section className="col" key={s.id}>
                <div className="col-h">
                  <Ic n={s.icon} /><h2>{s.label}</h2><span className="badge">{list.length}</span>
                  {v > 0 && <span className="sum">{formatBRL(v)}</span>}
                </div>
                {list.length === 0 && <p className="empty">Nenhum pedido nesta etapa.</p>}
                {list.map(o => (
                  <OrderCard key={o.id} o={o} stage={s}
                    onOpen={() => openDetail(o)} onEdit={() => openEdit(o)} onDel={() => setConfirmDel(o.id)}
                    onNext={() => s.next && moveTo(o, s.next)} onPrev={() => s.prev && moveTo(o, s.prev)} />
                ))}
              </section>
            );
          })}
        </div>
      </main>

      {showSum && <Overlay onClose={() => setShowSum(false)}><DailySummary orders={orders} onClose={() => setShowSum(false)} /></Overlay>}

      {(modal === "add" || modal === "edit") && (
        <Overlay onClose={() => setModal(null)}>
          <div className="dlg" role="dialog" aria-modal="true" aria-label={modal === "add" ? "Novo pedido" : "Editar pedido"}>
            <div className="dlg-h">
              <h2>{modal === "add" ? "Novo pedido" : "Editar pedido"}</h2>
              <button className="x" onClick={() => setModal(null)} aria-label="Fechar"><Ic n="x" /></button>
            </div>
            <div className="dlg-b"><FormBody form={form} setForm={setForm} /></div>
            <div className="dlg-f">
              <button className="btn" onClick={() => setModal(null)}>Cancelar</button>
              <button className="btn primary" onClick={handleSave}>{modal === "add" ? "Criar pedido" : "Salvar alterações"}</button>
            </div>
          </div>
        </Overlay>
      )}

      {modal === "detail" && detailOrder && (
        <Overlay onClose={() => setModal(null)}>
          <DetailPanel o={detailOrder} onClose={() => setModal(null)} onEdit={() => openEdit(detailOrder)} onDelete={() => setConfirmDel(detailOrder.id)} />
        </Overlay>
      )}

      {confirmDel && (
        <Overlay onClose={() => setConfirmDel(null)}>
          <div className="dlg sm" role="alertdialog" aria-modal="true" aria-label="Excluir pedido">
            <div className="dlg-h"><h2>Excluir este pedido?</h2></div>
            <div className="dlg-b"><p style={{ margin: 0, color: "var(--ink-2)" }}>O pedido será removido do sistema e não poderá ser recuperado. Se tiver dúvida, gere um backup antes.</p></div>
            <div className="dlg-f">
              <button className="btn" onClick={() => setConfirmDel(null)}>Cancelar</button>
              <button className="btn primary" style={{ background: "var(--alert-solid)", borderColor: "var(--alert-solid)", color: "#fff" }} onClick={() => handleDelete(confirmDel)}>Excluir pedido</button>
            </div>
          </div>
        </Overlay>
      )}

      {toast && <div className={"toast" + (toast.type === "err" ? " err" : "")} role="status"><Ic n={toast.type === "err" ? "alert" : "check"} />{toast.msg}</div>}
    </>
  );
}

/* ---------- Cartão do pedido ---------- */
function OrderCard({ o, stage, onOpen, onEdit, onDel, onNext, onPrev }) {
  const late = isOverdue(o);
  const due = dueInfo(o);
  const stop = e => e.stopPropagation();
  return (
    <article className={"card" + (late ? " is-late" : "")} onClick={onOpen} tabIndex={0}
      onKeyDown={e => { if (e.key === "Enter" && e.target === e.currentTarget) onOpen(); }}>
      <div className="c-top">
        <span className="num">{o.numero || o.id}</span>
        {o.prioridade === "urgente" && <span className="urg">Urgente</span>}
        {o.prioridade === "alta" && <span className="urg alta">Prioridade alta</span>}
      </div>
      <h3>{o.cliente}</h3>
      <p className="desc">{tidy(o.descricao)}</p>
      {(o.quantidade || o.valor) && (
        <div className="meta">
          {o.quantidade && <span><Ic n="package" />{Number(o.quantidade).toLocaleString("pt-BR")} un.</span>}
          {o.valor && <span className="money">{formatBRL(o.valor)}</span>}
        </div>
      )}
      {o.responsavel && <div className="meta"><span><Ic n="user" />{o.responsavel}</span></div>}
      {due && <div className={"due " + due.k}><Ic n={due.k === "late" ? "alert" : "calendar"} /><span>{due.t}</span>{due.r && <em>{due.r}</em>}</div>}
      {o.observacoes && <p className="obs">{tidy(o.observacoes)}</p>}
      <div className="c-act" onClick={stop}>
        {stage.act ? <button className="btn sm" onClick={onNext}>{stage.act}</button> : <span></span>}
        <span className="ib">
          {stage.prev && <button onClick={onPrev} aria-label="Voltar etapa" title="Voltar etapa"><Ic n="back" /></button>}
          <button onClick={onEdit} aria-label="Editar pedido" title="Editar"><Ic n="pencil" /></button>
          <button onClick={onDel} aria-label="Excluir pedido" title="Excluir"><Ic n="trash" /></button>
        </span>
      </div>
    </article>
  );
}

/* ---------- Detalhes ---------- */
function DetailPanel({ o, onClose, onEdit, onDelete }) {
  const [tab, setTab] = useState("info");
  const pr = PRIORITIES.find(p => p.id === o.prioridade);
  const due = dueInfo(o);
  const hist = [...(o.historico || [])].reverse();
  const rows = [
    ["Etapa", stageLabel(o.status)],
    ["Prioridade", pr ? pr.label : "—"],
    ["Quantidade", o.quantidade ? Number(o.quantidade).toLocaleString("pt-BR") + " un." : "—"],
    ["Valor", o.valor ? formatBRL(o.valor) : "—"],
    ["Prazo", due ? due.t + (due.r ? " (" + due.r + ")" : "") : "—", due && due.k === "late"],
    ["Responsável", o.responsavel || "—"],
    ["Observações", o.observacoes || "—"],
    ["Criado em", formatDT(o.criadoEm)],
  ];
  return (
    <div className="dlg" role="dialog" aria-modal="true" aria-label="Detalhes do pedido">
      <div className="dlg-h">
        <div>
          <div className="sub">{o.numero || o.id}</div>
          <h2>{o.cliente}</h2>
          <div className="sub" style={{ fontSize: 13.5, color: "var(--ink-2)" }}>{o.descricao}</div>
        </div>
        <button className="x" onClick={onClose} aria-label="Fechar"><Ic n="x" /></button>
      </div>
      <div className="tabs2" role="tablist">
        <button className="tab2" role="tab" aria-selected={tab === "info"} onClick={() => setTab("info")}>Detalhes</button>
        <button className="tab2" role="tab" aria-selected={tab === "hist"} onClick={() => setTab("hist")}>Histórico{hist.length > 0 ? " (" + hist.length + ")" : ""}</button>
      </div>
      <div className="dlg-b">
        {tab === "info"
          ? <dl style={{ margin: 0 }}>{rows.map(r => <div className="kv" key={r[0]}><dt>{r[0]}</dt><dd className={r[2] ? "bad" : ""}>{r[1]}</dd></div>)}</dl>
          : hist.length === 0
            ? <p style={{ color: "var(--muted)" }}>Sem histórico registrado.</p>
            : hist.map((h, i) => (
              <div className="tl" key={i}><i></i>
                <div style={{ flex: 1 }}>
                  <div className="tt"><b>{h.acao}</b><small>{formatDT(h.data)}</small></div>
                  <p>{h.detalhes}</p>
                </div>
              </div>
            ))}
      </div>
      <div className="dlg-f">
        <button className="btn danger" onClick={onDelete}><Ic n="trash" />Excluir</button>
        <span className="grow"></span>
        <button className="btn primary" onClick={onEdit}><Ic n="pencil" />Editar pedido</button>
      </div>
    </div>
  );
}

/* ---------- Resumo do dia ---------- */
function DailySummary({ orders, onClose }) {
  const late = orders.filter(isOverdue).sort(byPrazo);
  const soon = orders.filter(o => { const d = dayDiff(o.prazo); return d !== null && d >= 0 && d <= 7 && o.status !== "entregue"; }).sort(byPrazo);
  const soon3 = soon.filter(o => dayDiff(o.prazo) <= 3);
  const week = soon.filter(o => dayDiff(o.prazo) > 3);
  const hist = orders.flatMap(o => (o.historico || []).map(h => ({ ...h, cliente: o.cliente }))).sort((a, b) => new Date(b.data) - new Date(a.data)).slice(0, 6);
  const total = sumVal(orders);
  const ent = sumVal(orders.filter(o => o.status === "entregue"));
  const rest = (list, cls, icon, title, tag) => list.length > 0 && (
    <div className={"ss " + cls}>
      <h4><Ic n={icon} />{title} ({list.length})</h4>
      {list.map(o => (
        <div className="ss-r" key={o.id}>
          <div><b style={{ fontWeight: 600 }}>{o.cliente}</b><small>{tidy(o.descricao)}</small></div>
          <span className="tag">{tag(o)}</span>
        </div>
      ))}
    </div>
  );
  return (
    <div className="dlg" role="dialog" aria-modal="true" aria-label="Resumo do dia" style={{ width: 560 }}>
      <div className="dlg-h">
        <div>
          <h2>Resumo do dia</h2>
          <div className="sub">{new Date().toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long", year: "numeric" })}</div>
        </div>
        <button className="x" onClick={onClose} aria-label="Fechar"><Ic n="x" /></button>
      </div>
      <div className="dlg-b">
        <div className="fin">
          <div><span className="n">{formatBRL(total)}</span><span className="t">em carteira</span></div>
          <div><span className="n">{formatBRL(ent)}</span><span className="t">já entregue</span></div>
          <div><span className="n">{formatBRL(total - ent)}</span><span className="t">em andamento</span></div>
        </div>
        {rest(late, "bad", "alert", "Atrasados", o => "venceu em " + formatDate(o.prazo))}
        {rest(soon3, "soon", "clock", "Vencem em até 3 dias", o => { const d = dayDiff(o.prazo); return d === 0 ? "hoje" : d === 1 ? "amanhã" : "em " + d + " dias"; })}
        {rest(week, "", "calendar", "Vencem esta semana", o => "em " + dayDiff(o.prazo) + " dias")}
        {late.length === 0 && soon.length === 0 && <p className="ss-ok">Nenhum pedido atrasado ou vencendo em breve.</p>}
        {hist.length > 0 && (
          <div className="ss">
            <h4>Últimas movimentações</h4>
            {hist.map((h, i) => (
              <div className="ss-r" key={i}>
                <div><b style={{ fontWeight: 600 }}>{h.cliente}</b><small>{h.acao}: {h.detalhes}</small></div>
                <span className="tag" style={{ fontWeight: 400, color: "var(--muted)" }}>{formatDT(h.data)}</span>
              </div>
            ))}
          </div>
        )}
      </div>
      <div className="dlg-f"><button className="btn primary" onClick={onClose}>Ir para o painel</button></div>
    </div>
  );
}

/* ---------- Formulário ---------- */
function Field({ label, children }) { return <div className="f"><label>{label}</label>{children}</div>; }
function FormBody({ form, setForm }) {
  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));
  return (
    <div className="form">
      <Field label="Nº do processo ou licitação"><input className="inp" value={form.numero || ""} onChange={e => set("numero", e.target.value)} placeholder="Ex.: 60893/2025" /></Field>
      <Field label="Cliente ou órgão público *"><input className="inp" value={form.cliente || ""} onChange={e => set("cliente", e.target.value)} placeholder="Nome do cliente ou secretaria" /></Field>
      <Field label="Descrição do item ou lote *"><textarea className="inp" rows={3} value={form.descricao || ""} onChange={e => set("descricao", e.target.value)} placeholder="Descreva o pedido ou lote" /></Field>
      <div className="row2">
        <Field label="Quantidade"><input className="inp" type="number" value={form.quantidade || ""} onChange={e => set("quantidade", e.target.value)} placeholder="0" /></Field>
        <Field label="Valor da licitação (R$)"><input className="inp" type="number" step="0.01" value={form.valor || ""} onChange={e => set("valor", e.target.value)} placeholder="0,00" /></Field>
      </div>
      <div className="row2">
        <Field label="Prazo de entrega"><input className="inp" type="date" value={form.prazo || ""} onChange={e => set("prazo", e.target.value)} /></Field>
        <Field label="Responsável ou fornecedor"><input className="inp" value={form.responsavel || ""} onChange={e => set("responsavel", e.target.value)} placeholder="Quem está produzindo" /></Field>
      </div>
      <div className="row2">
        <Field label="Etapa">
          <select className="inp" value={form.status || "pendente"} onChange={e => set("status", e.target.value)}>
            {STAGES.map(s => <option key={s.id} value={s.id}>{s.label}</option>)}
          </select>
        </Field>
        <Field label="Prioridade">
          <select className="inp" value={form.prioridade || "media"} onChange={e => set("prioridade", e.target.value)}>
            {PRIORITIES.map(p => <option key={p.id} value={p.id}>{p.label}</option>)}
          </select>
        </Field>
      </div>
      <Field label="Observações"><textarea className="inp" rows={2} value={form.observacoes || ""} onChange={e => set("observacoes", e.target.value)} placeholder="Anotações importantes" /></Field>
    </div>
  );
}

function Overlay({ onClose, children }) {
  useEffect(() => {
    const h = e => { if (e.key === "Escape") onClose(); };
    document.addEventListener("keydown", h);
    return () => document.removeEventListener("keydown", h);
  }, []);
  return <div className="ov" onClick={e => { if (e.target === e.currentTarget) onClose(); }}>{children}</div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
